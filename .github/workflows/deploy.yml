name: Deploy iban.bio App

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to Server
              shell: bash
              run: |
                  # NVM ve Node ortamını yükle
                  export NVM_DIR="$HOME/.nvm"
                  [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

                  set +e

                  echo "🚀 Deployment basliyor (Local/Self-hosted)..."

                  # Projenin çalıştığı ana klasöre git
                  cd /home/ubuntu/iban-bio-app

                  echo "⬇️ Git pull..."
                  git pull origin main

                  echo "📦 Paketler yukleniyor..."
                  # Bağımlılıkları yükle (Yarn yüklü değilse 'npm install' da diyebilirsin)
                  yarn install

                  echo "🛡️ Mevcut build yedekleniyor..."
                  if [ -d ".next" ]; then
                      rm -rf .next_backup
                      mv .next .next_backup
                  fi

                  echo "🏗️ Build aliniyor..."
                  yarn build

                  if [ $? -eq 0 ]; then
                      echo "✅ Build BASARILI!"
                      
                      echo "🗑️ Yedek temizleniyor..."
                      rm -rf .next_backup
                      
                      echo "🔄 PM2 Reload..."
                      # PM2'nin globalde tanımlı olduğundan emin olmalısın
                      pm2 reload 1
                      
                      echo "🎉 Islem tamamlandi."
                  else
                      echo "❌ Build HATALI! Geri aliniyor..."
                      
                      rm -rf .next
                      
                      if [ -d ".next_backup" ]; then
                          mv .next_backup .next
                          echo "♻️ Eski versiyon geri yüklendi. Site çalışmaya devam ediyor."
                      else
                          echo "⚠️ Yedek bulunamadı! Site çalışmayabilir."
                      fi
                      
                      exit 1
                  fi
