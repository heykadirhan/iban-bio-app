name: Build Locally & Deploy to EC2 (No SSH)

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: [self-hosted, local-build]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install dependencies
              run: yarn install

            - name: Build project
              run: yarn build

            - name: Create Deployment Package
              run: tar -czf build-artifact.tar.gz .next public package.json next.config.js yarn.lock

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: next-build
                  path: build-artifact.tar.gz
                  retention-days: 1

    deploy:
        needs: build
        runs-on: [self-hosted, ec2-deploy]
        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v4
              with:
                  name: next-build

            - name: Extract & Deploy
              shell: bash
              run: |
                  echo "🚀 Deploy basliyor..."
                  cd /home/ubuntu/iban-bio-app

                  # Mevcut paketi aç (eski dosyaların üzerine yazar)
                  tar -xzf $GITHUB_WORKSPACE/build-artifact.tar.gz -C .

                  # Sadece production paketlerini yükle (Eğer yeni paket gelmişse)
                  yarn install --production

                  echo "🔄 PM2 Reload..."
                  pm2 reload 1 || pm2 start yarn --name "iban-bio" -- start

                  # Temizlik
                  rm $GITHUB_WORKSPACE/build-artifact.tar.gz
                  echo "🎉 Islem tamamlandi."
