name: GitHub Build & Self-Hosted Deploy

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build project
              run: yarn build
              env:
                  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
                  NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
                  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
                  MONGODB_URI: ${{ secrets.MONGODB_URI }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  GA_ID: ${{ secrets.GA_ID }}
                  HOTJAR_SITE_ID: ${{ secrets.HOTJAR_SITE_ID }}
                  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
                  IBAN_API_KEY: ${{ secrets.IBAN_API_KEY }}
                  NEXT_PUBLIC_CRYPTO_API_URL: ${{ secrets.NEXT_PUBLIC_CRYPTO_API_URL }}
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
                  AWS_STORAGE_URL: ${{ secrets.AWS_STORAGE_URL }}
                  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
                  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
                  TWILIO_SERVICE_SID: ${{ secrets.TWILIO_SERVICE_SID }}
                  TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}

            - name: Compress Build Files
              run: tar -czf release.tar.gz .next public package.json next.config.ts yarn.lock

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: next-app-bundle
                  path: release.tar.gz
                  retention-days: 1

    deploy:
        needs: build
        runs-on: self-hosted
        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v4
              with:
                  name: next-app-bundle

            - name: Extract and Reload PM2
              shell: bash
              run: |
                  echo "🚀 Deployment basliyor..."
                  cd /home/ibanbio_runner/app

                  # Paketi açıyoruz
                  tar -xzf $GITHUB_WORKSPACE/release.tar.gz -C .

                  # Sadece eksik paketleri (production) yükle
                  yarn install --production --ignore-scripts

                  echo "🔄 PM2 Reloading..."
                  pm2 reload 1 || pm2 start yarn --name "iban-bio" -- start

                  # Temizlik
                  rm $GITHUB_WORKSPACE/release.tar.gz
                  echo "✅ Basariyla deploy edildi!"
