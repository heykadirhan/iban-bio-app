name: GitHub Build & Self-Hosted Deploy

on:
    push:
        branches: [main]

jobs:
    # 1. BÖLÜM: GitHub'ın kendi sunucusunda build alıyoruz
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'yarn'

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build project
              run: yarn build
              env:
                  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

            - name: Compress Build Files
              # Sadece production için gerekenleri paketliyoruz
              run: tar -czf release.tar.gz .next public package.json next.config.js yarn.lock

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: next-app-bundle
                  path: release.tar.gz
                  retention-days: 1 # Sunucuda yer kaplamasın, 1 gün yeterli

    # 2. BÖLÜM: Senin EC2 sunucun paketi indirip çalıştırıyor
    deploy:
        needs: build
        runs-on: self-hosted
        steps:
            - name: Download Artifact
              uses: actions/download-artifact@v4
              with:
                  name: next-app-bundle

            - name: Extract and Reload PM2
              shell: bash
              run: |
                  echo "🚀 Deployment basliyor..."
                  cd /home/ubuntu/iban-bio-app

                  # Paketi açıyoruz
                  tar -xzf $GITHUB_WORKSPACE/release.tar.gz -C .

                  # Sadece eksik paketleri (production) yükle
                  yarn install --production --ignore-scripts

                  echo "🔄 PM2 Reloading..."
                  pm2 reload 1 || pm2 start yarn --name "iban-bio" -- start

                  # Temizlik
                  rm $GITHUB_WORKSPACE/release.tar.gz
                  echo "✅ Basariyla deploy edildi!"
